[project]
name = "ffmodel"
version = "0.1.0"
description = "Fantasy basketball decision aids: data contract, loaders, and modeling core"
requires-python = ">=3.12"
dependencies = [
    "nba_api>=1.11,<2",
    "sqlalchemy>=2.0,<3",
    "anyascii>=0.3",
    "typer>=0.12",
    "requests>=2.31",
]

[project.scripts]
ffm = "ffmodel.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "import-linter>=2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ffmodel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: hits the real NBA stats source (manual)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
